<script>
    /* PIN-first gate + 12h server sessions. Raw PIN never stored; only the
       session token (memory + localStorage) is sent; all checks server-side. */
    (function initAuthHistory() {
      var lockEl = document.getElementById('lock-screen');
      var lockTitle = document.getElementById('lock-title');
      var lockSub = document.getElementById('lock-sub');
      var pinInput = document.getElementById('pin-input');
      var pinSubmit = document.getElementById('pin-submit');
      var pinError = document.getElementById('pin-error');
      var changeBtn = document.getElementById('pin-change-btn');
      var logoutBtn = document.getElementById('pin-logout-btn');
      var modal = document.getElementById('pin-modal');
      var apiBtn = document.getElementById('api-key-btn');
      var apiModal = document.getElementById('api-modal');
      var apiInput = document.getElementById('api-key-input');
      var apiSave = document.getElementById('api-save');
      var apiCancel = document.getElementById('api-cancel');
      var apiError = document.getElementById('api-error');
      var sheetBtn = document.getElementById('sheet-btn');
      var sheetModal = document.getElementById('sheet-modal');
      var sheetInput = document.getElementById('sheet-id-input');
      var sheetSave = document.getElementById('sheet-save');
      var sheetCancel = document.getElementById('sheet-cancel');
      var sheetError = document.getElementById('sheet-error');
      var histCard = document.getElementById('history-card');
      var histList = document.getElementById('history-list');
      var histLoad = document.getElementById('history-load');
      var histMore = document.getElementById('history-more');
      var histRefresh = document.getElementById('history-refresh');
      var histSub = document.getElementById('history-sub');
      var histEmpty = document.getElementById('history-empty');
      var histNoResults = document.getElementById('history-noresults');
      var histFilters = document.getElementById('history-filters');
      var histEmptyBtn = document.getElementById('history-empty-btn');
      var trashBtn = document.getElementById('trash-btn');
      var householdBtn = document.getElementById('household-btn');
      var sessionsBtn = document.getElementById('sessions-btn');
      var backupBtn = document.getElementById('backup-btn');
      var featureSettingsBtn = document.getElementById('feature-settings-btn');
      var confirmModal = document.getElementById('confirm-modal');
      var confirmTitle = document.getElementById('confirm-title');
      var confirmBody = document.getElementById('confirm-body');
      var confirmOk = document.getElementById('confirm-ok');
      var confirmCancel = document.getElementById('confirm-cancel');
      var confirmError = document.getElementById('confirm-error');
      var trashModal = document.getElementById('trash-modal');
      var trashTitle = document.getElementById('trash-title');
      var trashCount = document.getElementById('trash-count');
      var trashList = document.getElementById('trash-list');
      var trashClose = document.getElementById('trash-close');
      var trashFilterEntries = document.getElementById('trash-filter-entries');
      var trashFilterTxns = document.getElementById('trash-filter-txns');
      if (!lockEl || !pinInput || !pinSubmit) return;
      var mode = 'login'; // login | setup-new | setup-confirm
      var firstPin = '';
      var pinBusy = false;
      var histOffset = 0;
      var histLimit = 10;
      var hasBackend = !!(window.google && google.script && google.script.run);
      // Session countdown/renewal state. sessExpiresAt and sessRenew always
      // mirror the last server validation; the server stays authoritative.
      var sessExpiresAt = 0;
      var sessRenew = true;
      var sessWarned10 = false;
      var sessTimer = null;
      var sessLastTouch = 0;
      var SESS_TOUCH_MIN_MS = 60000;
      var SESS_WARN_MS = 10 * 60 * 1000;
      var SESS_COUNTDOWN_MS = 30 * 60 * 1000;

      function setLockedUI(locked) {
        try { document.body.classList.toggle('locked', !!locked); } catch (e) {}
        if (locked) { lockEl.classList.remove('hidden'); }
        else { lockEl.classList.add('hidden'); }
        [changeBtn, apiBtn, sheetBtn, sessBtn, trashBtn, householdBtn, sessionsBtn, backupBtn, featureSettingsBtn, logoutBtn].forEach(function (b) { if (b) b.classList.toggle('hidden', !!locked); });
        try { window.dispatchEvent(new CustomEvent('cf:close-settings')); } catch (e) {}
        if (histCard) histCard.classList.toggle('hidden', !!locked);
        // Never leave another session's rows in memory: locking drops the cache.
        if (locked) {
          try { invalidateHistCache(); } catch (e) {}
          // Access state is session-scoped: never keep showing the previous
          // session's verified status behind the PIN gate.
          try { if (typeof paintAccessPill === 'function') paintAccessPill({ verified: false, access: 'unknown', detail: 'Sign in to verify access.' }); } catch (e2) {}
        }
      }
      function setError(msg) { if (pinError) pinError.textContent = msg || ''; }
      function paintMode(msg) {
        if (mode === 'setup-new') {
          lockTitle.textContent = 'Set up a 6-digit PIN';
          lockSub.textContent = 'First run — choose a 6-digit PIN. It is stored on Google\'s server, never on this device.';
          pinSubmit.textContent = 'Continue';
        } else if (mode === 'setup-confirm') {
          lockTitle.textContent = 'Confirm your PIN';
          lockSub.textContent = 'Enter the same 6 digits again.';
          pinSubmit.textContent = 'Save PIN';
        } else {
          lockTitle.textContent = 'Enter PIN';
          lockSub.textContent = 'Enter your 6-digit PIN to continue.';
          pinSubmit.textContent = 'Unlock';
        }
        setError(msg || '');
        pinInput.value = '';
        var recovery = document.getElementById('lock-recovery');
        if (recovery) recovery.classList.toggle('hidden', mode !== 'login');
        syncPinSubmit();
        if (!lockEl.classList.contains('hidden')) {
          try { pinInput.focus(); } catch (e) {}
        }
      }
      function onUnlocked() {
        setLockedUI(false);
        try { window.dispatchEvent(new CustomEvent('cf:unlocked')); } catch (e) {}
        checkSpreadsheetAndKey();
        // Access state is only ever shown after the server confirms it. Until
        // then the pill reads "Access not checked" (see paintAccessPill).
        refreshAccessStatus();
        // Show the first history page after the UI is interactive. Deferred
        // so unlock and the entry form never wait on it; a first run shows the
        // empty state instead of a manual "show entries" step.
        deferIdle(function () { showFirstPage(); });
        refreshSessionState();
      }
      function lockToLogin(msg) {
        mode = 'login';
        firstPin = '';
        stopSessTimer();
        try { if (typeof closeApiModal === 'function') closeApiModal(); } catch (e) {}
        try { if (typeof closeSheetModal === 'function') closeSheetModal(); } catch (e) {}
        try { if (typeof closeSessModal === 'function') closeSessModal(); } catch (e) {}
        try { if (typeof closeConfirmModal === 'function') closeConfirmModal(); } catch (e) {}
        try { if (typeof closeTrashModal === 'function') closeTrashModal(); } catch (e) {}
        setLockedUI(true);
        paintMode(msg || '');
      }
      window.addEventListener('cf:auth-expired', function (e) {
        var m = (e && e.detail) || 'Session expired - please log in again.';
        lockToLogin(m);
      });
      function valid6(v) { return /^\d{6}$/.test(v || ''); }
      function pinDigits(v) {
        return String(v || '')
          .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
          .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); })
          .replace(/\D/g, '')
          .slice(0, 6);
      }
      function syncPinSubmit() {
        if (!pinSubmit) return;
        pinSubmit.disabled = !valid6((pinInput.value || '').trim());
      }
      function submitPin() {
        var v = (pinInput.value || '').trim();
        if (!valid6(v)) { setError('PIN must be exactly 6 digits.'); return; }
        if (pinBusy) return;
        if (!hasBackend) { try { cfSaveSession('preview', Date.now() + 43200000); } catch (e) {} onUnlocked(); return; }
        pinBusy = true;
        cfBusyBtn(pinSubmit, true, 'Checking…');
        setError('');
        if (mode === 'setup-new') {
          firstPin = v;
          mode = 'setup-confirm';
          pinBusy = false;
          cfBusyBtn(pinSubmit, false);
          syncPinSubmit();
          paintMode();
          return;
        }
        if (mode === 'setup-confirm') {
          if (v !== firstPin) {
            pinBusy = false;
            cfBusyBtn(pinSubmit, false);
            syncPinSubmit();
            firstPin = '';
            mode = 'setup-new';
            paintMode('PINs do not match — try again.');
            return;
          }
          google.script.run
            .withSuccessHandler(function (sess) {
              pinBusy = false;
              cfBusyBtn(pinSubmit, false);
              syncPinSubmit();
              firstPin = '';
              if (sess && sess.token) {
                try { cfSaveSession(sess.token, sess.expiresAt); } catch (e) {}
                onUnlocked();
              } else {
                setError('Could not create session - try again.');
              }
            })
            .withFailureHandler(function (err) {
              pinBusy = false;
              cfBusyBtn(pinSubmit, false);
              syncPinSubmit();
              setError('Could not save PIN: ' + (err && err.message ? err.message : err));
            })
            .setupPin(v);
          return;
        }
        google.script.run
          .withSuccessHandler(function (sess) {
            pinBusy = false;
            cfBusyBtn(pinSubmit, false);
            syncPinSubmit();
            if (sess && sess.token) {
              try { cfSaveSession(sess.token, sess.expiresAt); } catch (e) {}
              onUnlocked();
            } else {
              setError('Wrong PIN — try again.');
              pinInput.value = '';
              syncPinSubmit();
              try { pinInput.focus(); } catch (e) {}
            }
          })
          .withFailureHandler(function (err) {
            pinBusy = false;
            cfBusyBtn(pinSubmit, false);
            syncPinSubmit();
            setError('Error: ' + (err && err.message ? err.message : err));
          })
          .login(v);
      }
      pinInput.addEventListener('input', function () {
        pinInput.value = pinDigits(pinInput.value);
        setError('');
        syncPinSubmit();
        if (pinInput.value.length === 6) { setTimeout(function () { if (pinInput.value.length === 6 && !lockEl.classList.contains('hidden')) submitPin(); }, 250); }
      });
      pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPin(); });
      pinSubmit.addEventListener('click', submitPin);

      // Change PIN modal (session + old PIN required server-side)
      function openModal() {
        if (!modal) return;
        modal._returnFocus = document.activeElement;
        modal.classList.remove('hidden');
        var e2 = document.getElementById('pin-change-error');
        if (e2) e2.textContent = '';
        ['pin-old', 'pin-new', 'pin-new2'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
        try { var f = document.getElementById('pin-old'); if (f) f.focus(); } catch (e) {}
      }
      function closeModal() {
        if (!modal || modal.classList.contains('hidden')) return;
        var back = modal._returnFocus;
        modal._returnFocus = null;
        modal.classList.add('hidden');
        try { if (back && back.focus) back.focus(); } catch (e) {}
      }
      if (changeBtn) changeBtn.addEventListener('click', openModal);
      var cancelBtn = document.getElementById('pin-change-cancel');
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
      ['pin-old', 'pin-new', 'pin-new2'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', function () {
          el.value = pinDigits(el.value);
        });
      });
      if (modal) modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
      var saveBtn = document.getElementById('pin-change-save');
      if (saveBtn) saveBtn.addEventListener('click', function () {
        var oldP = (document.getElementById('pin-old').value || '').trim();
        var newP = (document.getElementById('pin-new').value || '').trim();
        var newP2 = (document.getElementById('pin-new2').value || '').trim();
        var errEl = document.getElementById('pin-change-error');
        function fail(m) { if (errEl) errEl.textContent = m; }
        if (!valid6(oldP) || !valid6(newP)) { fail('All PINs must be exactly 6 digits.'); return; }
        if (newP !== newP2) { fail('New PINs do not match.'); return; }
        if (!hasBackend) { try { cfSaveSession(newP, Date.now() + 43200000); } catch (e) {} closeModal(); return; }
        cfBusyBtn(saveBtn, true, 'Saving…');
        google.script.run
          .withSuccessHandler(function (sess) {
            cfBusyBtn(saveBtn, false);
            if (sess && sess.token) {
              try { cfSaveSession(sess.token, sess.expiresAt); } catch (e) {}
            }
            closeModal();
            try { setStatus('PIN changed. All other sessions revoked.', 'success'); } catch (e) {}
          })
          .withFailureHandler(function (err) {
            cfBusyBtn(saveBtn, false);
            if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {
              closeModal();
              try { cfNoteAuthExpired(); } catch (e) {}
              return;
            }
            fail('Error: ' + (err && err.message ? err.message : err));
          })
          .changePin(oldP, newP, sessionToken);
      });

      // Gemini API key prompt: after every PIN unlock (fresh setup or existing
      // PIN login), ask for the key when none is stored server-side.
      var apiHasKey = false;
      function paintApiText() {
        var title = document.getElementById('api-title');
        var sub = document.getElementById('api-sub');
        if (apiHasKey) {
          if (title) title.textContent = 'Change Gemini API key';
          if (sub) sub.textContent = 'A Gemini API key is already stored on the server. Paste a new key from Google AI Studio to replace it.';
        } else {
          if (title) title.textContent = 'Add Gemini API key';
          if (sub) sub.textContent = 'No Gemini API key found on the server. Paste your key from Google AI Studio to enable logging.';
        }
      }
      function openApiModal(msg) {
        if (!apiModal) return;
        apiModal._returnFocus = document.activeElement;
        paintApiText();
        if (apiError) apiError.textContent = msg || '';
        if (apiInput) apiInput.value = '';
        apiModal.classList.remove('hidden');
        try { if (apiInput) apiInput.focus(); } catch (e) {}
      }
      function closeApiModal() {
        if (!apiModal || apiModal.classList.contains('hidden')) return;
        var back = apiModal._returnFocus;
        apiModal._returnFocus = null;
        apiModal.classList.add('hidden');
        try { if (back && back.focus) back.focus(); } catch (e) {}
      }
      function setApiKeyLabel(has) {
        if (!apiBtn) return;
        apiHasKey = !!has;
        var label = apiBtn.querySelector('.menu-label');
        var text = apiHasKey ? 'Change Gemini key' : 'Set Gemini key';
        if (label) label.textContent = text;
        else apiBtn.textContent = text;
      }
      function checkGeminiKey() {
        if (!hasBackend) return;
        if (!sessionToken) return;
        var tok = arguments.length ? arguments[0] : sessionToken;
        if (tok !== sessionToken) return;
        try {
          google.script.run
            .withSuccessHandler(function (has) {
              cfgFinish();
              if (cfgStale(tok)) return;
              setApiKeyLabel(!!has);
              if (!has) openApiModal('');
            })
            .withFailureHandler(function (err) {
              cfgFinish();
              if (cfgStale(tok)) return;
              if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {
                try { cfNoteAuthExpired(); } catch (e) {}
                return;
              }
              // Non-auth errors (e.g. transient) must not block the app and
              // must not be reported as a missing configuration.
            })
            .hasGeminiKey(tok);
        } catch (e) { cfgFinish(); }
      }
      window.addEventListener('cf:missing-key', function () { openApiModal(''); });
      if (apiBtn) apiBtn.addEventListener('click', function () { openApiModal(''); });
      if (apiCancel) apiCancel.addEventListener('click', closeApiModal);
      if (apiModal) apiModal.addEventListener('click', function (e) { if (e.target === apiModal) closeApiModal(); });
      if (apiInput) apiInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (apiSave) apiSave.click(); } });
      if (apiSave) apiSave.addEventListener('click', function () {
        var k = (apiInput && apiInput.value ? apiInput.value : '').trim();
        if (!k) { if (apiError) apiError.textContent = 'Paste your Gemini API key first.'; return; }
        if (!hasBackend) { closeApiModal(); return; }
        cfBusyBtn(apiSave, true, 'Saving…');
        if (apiError) apiError.textContent = '';
        google.script.run
          .withSuccessHandler(function () {
            cfBusyBtn(apiSave, false);
            closeApiModal();
            setApiKeyLabel(true);
            try { setStatus('Gemini API key saved.', 'success'); } catch (e) {}
          })
          .withFailureHandler(function (err) {
            cfBusyBtn(apiSave, false);
            if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {
              closeApiModal();
              try { cfNoteAuthExpired(); } catch (e) {}
              return;
            }
            if (apiError) apiError.textContent = 'Error: ' + (typeof cfCleanError === 'function' ? cfCleanError(err) : (err && err.message ? err.message : err));
          })
          .saveGeminiKey(k, sessionToken);
      });

      // Google Sheet prompt: mirrors the API-key modal. Container-bound scripts
      // (copied from a Sheet) need nothing; standalone scripts ask for ID/URL.
      var sheetHasValue = false;
      function paintSheetText() {
        var title = document.getElementById('sheet-title');
        var sub = document.getElementById('sheet-sub');
        if (sheetHasValue) {
          if (title) title.textContent = 'Change Google Sheet';
          if (sub) sub.textContent = 'A Google Sheet is already set on the server. Paste a new Sheet ID or full Sheet URL to replace it.';
        } else {
          if (title) title.textContent = 'Set Google Sheet';
          if (sub) sub.textContent = 'No Google Sheet found on the server. Paste your Sheet ID or full Sheet URL to enable logging.';
        }
      }
      function openSheetModal(msg) {
        if (!sheetModal) return;
        sheetModal._returnFocus = document.activeElement;
        paintSheetText();
        if (sheetError) sheetError.textContent = msg || '';
        if (sheetInput) sheetInput.value = '';
        sheetModal.classList.remove('hidden');
        try { if (sheetInput) sheetInput.focus(); } catch (e) {}
      }
      function closeSheetModal() {
        if (!sheetModal || sheetModal.classList.contains('hidden')) return;
        var back = sheetModal._returnFocus;
        sheetModal._returnFocus = null;
        sheetModal.classList.add('hidden');
        try { if (back && back.focus) back.focus(); } catch (e) {}
      }
      // The three small configuration dialogs share one Escape path; each closes
      // only itself and returns focus to whatever opened it.
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (modal && !modal.classList.contains('hidden')) { closeModal(); return; }
        if (apiModal && !apiModal.classList.contains('hidden')) { closeApiModal(); return; }
        if (sheetModal && !sheetModal.classList.contains('hidden')) { closeSheetModal(); return; }
      });
      function setSheetLabel(has) {
        if (!sheetBtn) return;
        sheetHasValue = !!has;
        var label = sheetBtn.querySelector('.menu-label');
        var text = sheetHasValue ? 'Change Google Sheet' : 'Set Google Sheet';
        if (label) label.textContent = text;
        else sheetBtn.textContent = text;
      }
      // ---------- Access status (server-verified, never assumed) ----------
      // The pill NEVER claims Private on its own. It starts unknown and is
      // only repainted from a server response; a failed or stale response
      // leaves the honest neutral state in place.
      var accessPillPending = false;
      function paintAccessPill(state) {
        var dot = document.getElementById('pill-dot');
        var label = document.getElementById('pill-access');
        var pill = document.getElementById('session-pill');
        var s = state || {};
        var mode = s.verified && s.access === 'public' ? 'public'
          : (s.verified && s.access === 'private' ? 'private' : 'unknown');
        var text = mode === 'public' ? 'Public'
          : (mode === 'private' ? 'Private' : 'Access not checked');
        if (dot) dot.className = 'dot ' + mode;
        if (label) {
          label.textContent = text;
          label.classList.toggle('pending', mode === 'unknown');
        }
        if (pill) {
          pill.title = mode === 'unknown'
            ? 'Access mode could not be verified from inside the app. ' +
              (s.detail || 'Only the deployment owner can read it in Apps Script > Deploy > Manage deployment.')
            : (s.detail || '');
          try { pill.setAttribute('aria-label', 'Access status: ' + text + (pill.title ? '. ' + pill.title : '')); } catch (e) {}
        }
        return mode;
      }
      function refreshAccessStatus() {
        if (!hasBackend || !sessionToken) return;
        if (document.body.classList.contains('locked')) return;
        if (accessPillPending) return; // never fire duplicate checks
        accessPillPending = true;
        var tokenAtCall = sessionToken;
        paintAccessPill({ verified: false, access: 'unknown', detail: 'Checking…' });
        cfCall('getAccessStatus', [tokenAtCall]).then(function (res) {
          accessPillPending = false;
          // Ignore a response that belongs to a session we already left.
          if (tokenAtCall !== sessionToken) return;
          paintAccessPill(res || { verified: false, access: 'unknown' });
        }).catch(function (err) {
          accessPillPending = false;
          if (tokenAtCall !== sessionToken) return;
          if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {
            try { cfNoteAuthExpired(); } catch (e) {}
            return;
          }
          // Transient failure stays honest and neutral.
          paintAccessPill({ verified: false, access: 'unknown', detail: 'Access check failed; showing unknown.' });
        });
      }
      // ---------- Configuration check (discreet pending state) ----------
      // Unlock silently starts two backend calls (Sheet configured? Gemini key
      // present?). This shows one small, non-blocking status for that work: the
      // entry form stays fully usable, and every terminal path - success,
      // missing configuration, auth expiry, transient failure - clears it.
      // A missing Sheet/API key modal opens ONLY when the server confirmed the
      // value is absent; a transient error is never reported as "not set up".
      var cfgBusy = false;
      function setCfgNote(text) {
        var el = document.getElementById('cfg-note');
        if (!el) return;
        if (text) { el.textContent = text; el.classList.remove('hidden'); }
        else { el.textContent = ''; el.classList.add('hidden'); }
      }
      function cfgStale(tok) {
        // A response that belongs to a session we already left (logout, PIN
        // change, expiry) must never open a modal or repaint the new session.
        return tok !== sessionToken || document.body.classList.contains('locked');
      }
      function cfgFinish() { cfgBusy = false; setCfgNote(''); }
      function checkSpreadsheetAndKey() {
        if (!hasBackend) return;
        if (!sessionToken) return;
        if (document.body.classList.contains('locked')) return;
        if (cfgBusy) return; // never fire duplicate configuration checks
        cfgBusy = true;
        var tok = sessionToken;
        setCfgNote('Checking configuration…');
        try {
          google.script.run
            .withSuccessHandler(function (hasSheet) {
              if (cfgStale(tok)) { cfgFinish(); return; }
              setSheetLabel(!!hasSheet);
              if (!hasSheet) {
                cfgFinish();
                openSheetModal('');
                checkGeminiKeyQuiet();
                return;
              }
              checkGeminiKey(tok);
            })
            .withFailureHandler(function (err) {
              if (cfgStale(tok)) { cfgFinish(); return; }
              cfgFinish();
              if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {
                try { cfNoteAuthExpired(); } catch (e) {}
                return;
              }
              // Transient failure: say so plainly, claim nothing about setup.
              try { setStatus('Configuration check could not finish — you can still try logging.', ''); } catch (e2) {}
              checkGeminiKeyQuiet();
            })
            .hasSpreadsheet(tok);
        } catch (e) { cfgFinish(); }
      }
      function checkGeminiKeyQuiet() {
        if (!hasBackend) return;
        if (!sessionToken) return;
        var tok = sessionToken;
        try {
          google.script.run
            .withSuccessHandler(function (has) { if (!cfgStale(tok)) setApiKeyLabel(!!has); })
            .withFailureHandler(function () {})
            .hasGeminiKey(tok);
        } catch (e) {}
      }
      window.addEventListener('cf:missing-sheet', function () { openSheetModal(''); });
      if (sheetBtn) sheetBtn.addEventListener('click', function () { openSheetModal(''); });
      if (sheetCancel) sheetCancel.addEventListener('click', closeSheetModal);
      if (sheetModal) sheetModal.addEventListener('click', function (e) { if (e.target === sheetModal) closeSheetModal(); });
      if (sheetInput) sheetInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (sheetSave) sheetSave.click(); } });
      if (sheetSave) sheetSave.addEventListener('click', function () {
        var v = (sheetInput && sheetInput.value ? sheetInput.value : '').trim();
        if (!v) { if (sheetError) sheetError.textContent = 'Paste your Sheet ID or full Sheet URL first.'; return; }
        if (!hasBackend) { closeSheetModal(); return; }
        cfBusyBtn(sheetSave, true, 'Saving…');
        if (sheetError) sheetError.textContent = '';
        google.script.run
          .withSuccessHandler(function () {
            cfBusyBtn(sheetSave, false);
            closeSheetModal();
            setSheetLabel(true);
            try { setStatus('Google Sheet saved.', 'success'); } catch (e) {}
            checkGeminiKey();
          })
          .withFailureHandler(function (err) {
            cfBusyBtn(sheetSave, false);
            if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {
              closeSheetModal();
              try { cfNoteAuthExpired(); } catch (e) {}
              return;
            }
            if (sheetError) sheetError.textContent = 'Error: ' + (typeof cfCleanError === 'function' ? cfCleanError(err) : (err && err.message ? err.message : err));
          })

            '<div class="hist-item" data-entry-id="' + eid + '" data-txn-id="' + tid + '">' +
            '<div class="hist-top"><span class="hist-merchant" dir="auto">' + esc(merchant || 'Unknown') + '</span>' +
            (typeLabel ? '<span class="hist-badge ' + (isInc ? 'income' : 'expense') + '">' + esc(typeLabel) + '</span>' : '') + '</div>' +
            '<div class="hist-amount' + (amt < 0 ? ' neg' : '') + '">' + esc(amountText) + '</div>' +
            (desc ? '<div class="hist-sub" dir="auto">' + esc(desc) + '</div>' : '') +
            (meta.length ? '<div class="hist-meta" dir="auto">' + meta.map(function (v) { return esc(v); }).join(' \u00b7 ') + '</div>' : '') +
            '<div class="hist-actions">' +
              '<button type="button" class="hist-del" data-act="edit" data-entry-id="' + eid + '" aria-label="Edit ' + esc(merchant || 'entry') + '">Edit</button>' +
              (imageId ? '<button type="button" class="hist-del" data-act="image" data-image-id="' + esc(imageId) + '" aria-label="View receipt image for ' + esc(merchant || 'this entry') + '">View image</button>' : '') +
              (String(lg.reimbursable || '').toLowerCase() === 'yes' && String(lg.reimbursed || '').toLowerCase() !== 'yes'
                ? '<button type="button" class="hist-del" data-act="reimburse" data-entry-id="' + eid + '" aria-label="Mark ' + esc(merchant || 'this entry') + ' reimbursed">Mark reimbursed</button>'
                : '') +
              '<span class="hist-more-wrap"><button type="button" class="hist-del" data-act="more" data-entry-id="' + eid + '" data-txn-id="' + tid + '" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for ' + esc(merchant || 'this entry') + '" title="More actions">&#8943;</button></span>' +
            '</div></div>'
          );
        });
        if (!parts.length) {
          if (!append) histList.innerHTML = '';
          return;
        }
        var markup = parts.join('');
        if (append) histList.insertAdjacentHTML('beforeend', markup);
        else histList.innerHTML = markup;
      }
      window.cfRenderLogs = renderLogs;
      var histOpenMenu = null;
      function histActTarget(el) {
        while (el && el !== histList) {
          if (el.getAttribute && el.getAttribute('data-act')) return el;
          el = el.parentNode || el.parent || null;
        }
        return null;
      }
      function closeHistMenu(returnFocus) {

        var btn = menu._owner;
        try { menu.remove(); } catch (e) {}
        if (btn) btn.setAttribute('aria-expanded', 'false');
        histOpenMenu = null;
        if (returnFocus && btn) { try { btn.focus(); } catch (e2) {} }
      }
      function histBusy(btn, busy, label) { cfBusyBtn(btn, busy, busy ? (label || 'Working…') : null); }
      if (histList) histList.addEventListener('click', function (e) {
        var t = histActTarget(e.target);
        if (!t) return;
        var act = t.getAttribute('data-act');
        if (act === 'more') { openHistMenu(t); return; }
        if (act === 'del-entry') {
          closeHistMenu();
          deleteHistoryEntry(t.getAttribute('data-entry-id'), t);
          return;
        }
        if (act === 'del-txn') {
          closeHistMenu();
          deleteHistoryTransaction(t.getAttribute('data-txn-id'), t);
          return;
        }
      });
      document.addEventListener('click', function (e) {
        if (histOpenMenu && !histMenuContains(e.target)) closeHistMenu();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && histOpenMenu) closeHistMenu(true);
      });
      function histMenuContains(el) {
        var owner = histOpenMenu && histOpenMenu._owner;

          // menu bubbles to document, and must not close it immediately.

          el = el.parentNode || el.parent || null;
        }
        return false;
      }
      function openHistMenu(ownerBtn) {

        // reopening it. A different trigger switches the menu to that row.
        if (histOpenMenu && histOpenMenu._owner === ownerBtn) { closeHistMenu(); return; }
        closeHistMenu();

        var entryId = ownerBtn.getAttribute('data-entry-id') || '';
        var txnId = ownerBtn.getAttribute('data-txn-id') || '';
        var menu = document.createElement('div');
        menu.className = 'hist-menu';
        menu.setAttribute('role', 'menu');
        function addItem(label, act, attr, value) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'menu-item';
          b.setAttribute('role', 'menuitem');
          b.textContent = label;
          if (act) b.setAttribute('data-act', act);
          if (attr && value) b.setAttribute(attr, value);
          menu.appendChild(b);
          return b;
        }
        if (entryId) addItem('Move entry to Trash…', 'del-entry', 'data-entry-id', entryId);
        if (txnId) addItem('Move entire receipt to Trash…', 'del-txn', 'data-txn-id', txnId);
        if (!entryId && !txnId) {
          var none = addItem('No delete action for this record');
          none.disabled = true;
          none.title = 'This record has no Entry ID or Transaction ID.';
        }
        menu._owner = ownerBtn;
        if (wrap) wrap.appendChild(menu);
        menu.addEventListener('keydown', function (e) {
          var items = Array.prototype.filter.call(menu.querySelectorAll('.menu-item'), function (b) { return !b.disabled; });
          if (!items.length) return;
          var i = items.indexOf(document.activeElement);
          var next = -1;
          if (e.key === 'ArrowDown') next = i < 0 ? 0 : (i + 1) % items.length;
          else if (e.key === 'ArrowUp') next = i < 0 ? items.length - 1 : (i - 1 + items.length) % items.length;
          else if (e.key === 'Home') next = 0;
          else if (e.key === 'End') next = items.length - 1;
          if (next >= 0) { e.preventDefault(); items[next].focus(); }
        });

        histOpenMenu = menu;
        // Keep the menu inside the card (and the viewport at 320px) instead of
        // letting a short action row push it past the left edge.
        try {
          var card = document.getElementById('history-card');
          var bounds = (card || document.documentElement).getBoundingClientRect();
          var wrapRect = wrap.getBoundingClientRect();
          var menuRect = menu.getBoundingClientRect();
          var minLeft = bounds.left + 8;
          if (menuRect.left < minLeft) {
            menu.style.right = 'auto';
            menu.style.left = (minLeft - wrapRect.left) + 'px';
          }
          if (menuRect.bottom > window.innerHeight - 8 && ownerBtn.getBoundingClientRect) {
            menu.style.top = 'auto';
            menu.style.bottom = 'calc(100% + 6px)';
          }
        } catch (e4) {}
        try { (menu.querySelector('.menu-item:not([disabled])') || menu.querySelector('.menu-item')).focus(); } catch (e) {}
      }
      function deleteHistoryEntry(entryId, btn) {
        entryId = String(entryId || '');
        if (!entryId) {
          try { setStatus('That record has no Entry ID - reload Recent logs and try again.', 'error'); } catch (e) {}
          return;
        }
        if (!hasBackend || !sessionToken) return;
        var opId = (typeof cfUuid === 'function') ? cfUuid() : String(Date.now());
        openConfirmModal({
          title: 'Move entry to Trash?',
          body: 'Move this line item to Trash? Other items in this receipt will remain. You can recover it for 7 days.',
          okLabel: 'Move to Trash',
          danger: true
        }).then(function (yes) {
          if (!yes) return;
          histBusy(btn, true, 'Deleting…');
          cfCall('deleteEntries', [sessionToken, [entryId], opId]).then(function (res) {
            histBusy(btn, false);
            try {
              setStatus(res && res.alreadyMoved ? 'Entry was already in Trash.' : 'Entry moved to Trash. Recover it within 7 days.', 'success');
            } catch (e) {}
            noteHistoryMutated();
            refreshTrashIfOpen();
            try { window.dispatchEvent(new CustomEvent('cf:trash-mutation', { detail: { type: 'entry', entryId: entryId, message: 'Entry moved to Trash.' } })); } catch (e3) {}
          }, function (err) {
            histBusy(btn, false);
            if (cfAuthError(err)) { try { cfNoteAuthExpired(); } catch (e) {} return; }
            try {
              setStatus('Delete failed: ' + (typeof cfCleanError === 'function' ? cfCleanError(err) : ((err && err.message) || err)), 'error');
            } catch (e2) {}
          });
        });
      }
      function deleteHistoryTransaction(txnId, btn) {
        txnId = String(txnId || '');
        if (!txnId) return;
        if (!hasBackend || !sessionToken) return;
        histBusy(btn, true, 'Loading…');
        cfCall('describeTransaction', [sessionToken, txnId]).then(function (info) {
          histBusy(btn, false);
          info = info || {};
          if (!info.hasLiveRows) {
            try { setStatus('No live entries carry that Transaction ID — it may already be in Trash.', 'error'); } catch (e) {}
            noteHistoryMutated();
            return;
          }
          var n = Number(info.count || 0);
          var opId = (typeof cfUuid === 'function') ? cfUuid() : String(Date.now());
          var day = histDateLabel(info.date);
          var receipt = info.merchant ? '"' + info.merchant + '"' : 'this receipt';
          if (day) receipt += ' from ' + day;
          openConfirmModal({
            title: 'Move entire receipt to Trash?',
            body: 'Move ' + receipt + ' and all ' + fmtCount(n) +
              ' line item' + (n === 1 ? '' : 's') + ' to Trash? You can recover it for 7 days. After 7 days, it will be permanently deleted.',
            okLabel: 'Move receipt to Trash',
            danger: true
          }).then(function (yes) {
            if (!yes) return;
            histBusy(btn, true, 'Moving…');
            cfCall('deleteTransaction', [sessionToken, txnId, opId]).then(function (res) {
              histBusy(btn, false);
              try {
                setStatus('Receipt moved to Trash (' + ((res && res.moved) || n) + ' entries). Recover it within 7 days.', 'success');
              } catch (e) {}
              noteHistoryMutated();
              refreshTrashIfOpen();
              try { window.dispatchEvent(new CustomEvent('cf:trash-mutation', { detail: { type: 'transaction', groupId: opId, message: 'Receipt moved to Trash.' } })); } catch (e3) {}
            }, function (err) {
              histBusy(btn, false);
              if (cfAuthError(err)) { try { cfNoteAuthExpired(); } catch (e) {} return; }
              try {
                setStatus('Delete failed: ' + (typeof cfCleanError === 'function' ? cfCleanError(err) : ((err && err.message) || err)), 'error');
              } catch (e2) {}
            });
          });
        }, function (err) {
          histBusy(btn, false);
          if (cfAuthError(err)) { try { cfNoteAuthExpired(); } catch (e) {} return; }
          try {
            setStatus('Could not inspect that receipt: ' + (typeof cfCleanError === 'function' ? cfCleanError(err) : ((err && err.message) || err)), 'error');
          } catch (e2) {}
        });
      }
      function refreshTrashIfOpen() {
        try {
          var tm = document.getElementById('trash-modal');
          if (tm && !tm.classList.contains('hidden') && typeof refreshTrashList === 'function') refreshTrashList();
        } catch (e) {}
      }
      // Recent-logs page cache. Pages are keyed by offset and hold exact
      // server responses; the client never re-sorts or fabricates rows.
      // histGen rises on every refresh/invalidation so stale in-flight
      // responses can never overwrite newer data.
      var histCache = { pages: {}, total: 0 };
      var histPending = {};
      var histWaiters = {};
      var histReqGen = {};
      var histGen = 0;
      var CACHED_REVEAL_MS = 300;
      function deferIdle(fn) {
        try {
          if (typeof window !== 'undefined' && typeof window.requestIdleCallback === 'function') {
            window.requestIdleCallback(function () { fn(); });
            return;
          }
        } catch (e) {}
        setTimeout(fn, 0);
      }
      function cacheHistPage(offset, res) {
        histCache.pages[offset] = { logs: (res.logs || []).slice(), total: res.total || 0, hasMore: !!res.hasMore };
        histCache.total = res.total || 0;
      }
      function invalidateHistCache() {
        histCache = { pages: {}, total: 0 };

      function flushHistWaiters(offset, page, reqGen) {
        var w = histWaiters[offset] || [];
        var keep = [];
        var live = (reqGen === histGen);

          // still current. Waiters from newer generations stay queued for
          // their own response; older ones drop silently and must never
          // surface as an error.

      }
      // Fetches one page (or serves it from cache) and notifies waiters.
      // Silent prefetch and explicit user requests share in-flight calls, so
      // the same offset is never fetched twice for the same generation. A

      // never satisfy it. Set force to bypass the cache for explicit refreshes.

        var myGen = histGen;
        histWaiters[offset] = histWaiters[offset] || [];
        if (onDone) histWaiters[offset].push({ gen: myGen, fn: onDone });
        if (histPending[offset] && histReqGen[offset] === myGen) return;
        if (!hasBackend || !sessionToken) { flushHistWaiters(offset, null, myGen); return; }
        histPending[offset] = true;
        histReqGen[offset] = myGen;
        var reqGen = myGen;

          google.script.run
            .withSuccessHandler(function (res) {

              flushHistWaiters(offset, histCache.pages[offset], reqGen);

            })
            .withFailureHandler(function (err) {
              if (histReqGen[offset] === reqGen) histPending[offset] = false;

            })
            .getRecentLogs(sessionToken, offset, histLimit);
        } catch (err) {
          if (histReqGen[offset] === reqGen) histPending[offset] = false;
          flushHistWaiters(offset, { error: err }, reqGen);
        }
      }
      function prefetchPage(offset) {
        if (!hasBackend || !sessionToken) return;
        if (histCache.pages[offset] || histPending[offset]) return;
        requestHistPage(offset, null);
      }
      // Any successful mutation clears cached pages (offsets shift) and, when
      // rows are currently shown, reloads them fresh. Failed mutations leave
      // the cache alone. Same-scope callers use this directly; other scopes
      // announce through the cf:history-changed event below.
      function noteHistoryMutated() {

        var visible = !!(card && !card.classList.contains('hidden'));
        if (!visible) { invalidateHistCache(); return; }

      }
      if (typeof window !== 'undefined' && window.addEventListener) {
        window.addEventListener('cf:history-changed', function () {
          try { noteHistoryMutated(); } catch (e) {}
        });
      }
      function announceHistoryChanged() {
        try { window.dispatchEvent(new CustomEvent('cf:history-changed')); } catch (e) {}
      }
      function paintHistoryEmpty(isEmpty) {
        if (histEmpty) histEmpty.classList.toggle('hidden', !isEmpty);
        if (histNoResults) histNoResults.classList.add('hidden');
        if (histFilters) histFilters.classList.toggle('hidden', isEmpty);
        if (histSub) histSub.classList.toggle('hidden', isEmpty);
        if (isEmpty) {
          if (histLoad) histLoad.classList.add('hidden');
          if (histMore) histMore.classList.add('hidden');
        }
      }
      function renderHistPage(res, append) {
        var logs = Array.isArray(res.logs) ? res.logs : [];
        var total = Math.max(Number(res.total || 0), logs.length);
        renderLogs(logs, append);
        if (!append) histOffset = 0;
        histOffset += logs.length;
        histSub.textContent = total > 0
          ? 'Showing ' + fmtCount(histOffset) + ' of ' + fmtCount(total) + ' entries.'
          : 'Newest first, from all months.';
        paintHistoryEmpty(total === 0);
        if (res.hasMore) {
          histMore.classList.remove('hidden');
          histLoad.classList.add('hidden');
        } else {
          histMore.classList.add('hidden');
          if (histOffset > 0) histLoad.classList.add('hidden');
        }

      var histRefreshing = false;
      function fetchHistory(reset) {
        if (reset && histRefreshing) return;
        if (reset) histOffset = 0;
        if (!hasBackend) {
          histSub.textContent = 'Preview mode — connect to Apps Script to load real logs.';
          return;
        }
        if (!sessionToken) { try { setStatus('Unlock with your PIN first.', 'error'); } catch (e) {} return; }
        if (reset) {

            var err = page && page.error;
            if (typeof cfIsAuthError === 'function' && cfIsAuthError(err)) {

              try { setStatus('Your session expired. Enter your PIN again.', 'error'); } catch (e2) {}
              return;
            }
            var msg = typeof cfCleanError === 'function' ? cfCleanError(err) : (err && err.message ? err.message : String(err || 'Unknown error'));
            if (typeof navigator !== 'undefined' && navigator.onLine === false) msg = 'You’re offline.';
            if (histEmpty) histEmpty.classList.add('hidden');

            }

      }
      // First page: reveal cached rows with a brief cue, or fetch for real.
      function showFirstPage() {
        histOffset = 0;
        histGen++;
        var gen = histGen;
        if (!hasBackend) {
          histSub.textContent = 'Preview mode — connect to Apps Script to load real logs.';
          return;
        }
        if (!sessionToken) { try { setStatus('Unlock with your PIN first.', 'error'); } catch (e) {} return; }

            if (gen !== histGen) return;
            cfBusyBtn(histLoad, false);

            prefetchPage(histLimit);

        }
        fetchHistory(true);
      }
      // Next page: cached rows render immediately, then warm the following page.
      function showNextPage() {
        var wantOffset = histOffset;
        if (!hasBackend || !sessionToken) { fetchHistory(false); return; }
        var cached = histCache.pages[wantOffset];
        if (cached) {
          renderHistPage(cached, true);
          prefetchPage(wantOffset + histLimit);
          return;
        }
        fetchHistory(false);
      }
      // Refresh always goes to the server, never to the cache. With filters
      // showing, refresh the filtered view instead of silently dropping them.
      function histFiltersActive() {
        var q = document.getElementById('hist-search');
        if (q && String(q.value || '').trim()) return true;
        var t = document.getElementById('hist-type');
        if (t && t.value && t.value !== 'All') return true;
        var c = document.getElementById('hist-category');
        if (c && c.value && c.value !== 'All') return true;
        var m = document.getElementById('hist-member');
        if (m && m.value && m.value !== 'All') return true;
        var r = document.getElementById('hist-reimb');
        return !!(r && r.value);
      }
      function refreshHistory() {
        invalidateHistCache();
        var apply = document.getElementById('hist-apply');
        if (histFiltersActive() && apply) { apply.click(); return; }
        fetchHistory(true);
      }
      if (histLoad) histLoad.addEventListener('click', function () { showFirstPage(); });
      if (histMore) histMore.addEventListener('click', function () { showNextPage(); });
      if (histRefresh) histRefresh.addEventListener('click', function () { refreshHistory(); });
      if (histEmptyBtn) histEmptyBtn.addEventListener('click', function () {
        var card = document.querySelector('.shell > .card');
        try { if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
        var zone = document.getElementById('upload-zone');
        if (zone && zone.focus) {
          try { zone.focus({ preventScroll: true }); } catch (e2) { try { zone.focus(); } catch (e3) {} }
        }

      // auto-loads the actual page; otherwise stay on the PIN screen.
      setLockedUI(true);
      if (!hasBackend) { try { cfSaveSession('preview', Date.now() + 43200000); } catch (e) {} onUnlocked(); return; }
      var stored = null;
      try { stored = cfLoadSession(); } catch (e) {}
      if (stored && stored.t) {
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.valid) {
              try { sessionToken = stored.t; } catch (e) {}
              onUnlocked();
            } else {
              try { cfClearSession(); } catch (e) {}
              bootPinMode();
            }
          })
          .withFailureHandler(function () {
            try { cfClearSession(); } catch (e) {}
            bootPinMode();
          })
          .validateSession(stored.t);
      } else {
        bootPinMode();
      }
      function bootPinMode() {
        google.script.run
          .withSuccessHandler(function (setup) {
            mode = setup ? 'login' : 'setup-new';
            setLockedUI(true);
            paintMode();
          })
          .withFailureHandler(function () {
            mode = 'login';
            setLockedUI(true);
            paintMode();
          })
          .isPinSetup();
      }
    })();
