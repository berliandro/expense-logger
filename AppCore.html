<script>
    var form = document.getElementById('expense-form');
    var statusEl = document.getElementById('status');
    var submitBtn = document.getElementById('submit-btn');
    var submitLabel = document.getElementById('submit-label');
    var cameraBtn = document.getElementById('camera-btn');
    var galleryBtn = document.getElementById('gallery-btn');
    var cameraInput = document.getElementById('cameraInput');
    var galleryInput = document.getElementById('galleryInput');
    var uploadPlaceholder = document.getElementById('upload-placeholder');
    var uploadZone = document.getElementById('upload-zone');
    var previewWrap = document.getElementById('preview-wrap');
    var previewGrid = document.getElementById('preview-grid');
    var previewCount = document.getElementById('preview-count');
    var addMoreBtn = document.getElementById('add-more-btn');
    var removeAllBtn = document.getElementById('remove-all-btn');
    var photoCountLabel = document.getElementById('photo-count-label');
    var noteEl = document.getElementById('note');
    var counterEl = document.getElementById('counter');
    var activeChip = null;
    var savedNote = '';
    var selectedFiles = [];
    // One object URL per File, reused across renders. Rebuilding every preview
    // used to revoke and re-decode every thumbnail on each add/remove; that is
    // both flicker and wasted GPU work on phones.
    var previewUrlCache = new Map();
    function previewUrlFor(file) {
      var url = previewUrlCache.get(file);
      if (!url) {
        url = URL.createObjectURL(file);
        previewUrlCache.set(file, url);
      }
      return url;
    }
    function releasePreviewUrl(file) {
      var url = previewUrlCache.get(file);
      if (!url) return;
      previewUrlCache.delete(file);
      try { URL.revokeObjectURL(url); } catch (e) {}
    }
    function releaseAllPreviewUrls() {
      previewUrlCache.forEach(function (url) { try { URL.revokeObjectURL(url); } catch (e) {} });
      previewUrlCache.clear();
    }
    // No photo cap: Standard submissions run the same phased pipeline and
    // adaptive batching as Table rows, so any number of photos is accepted.
    // 12h server session token: kept in memory + localStorage, sent with every
    // sensitive call. The raw PIN is never stored. All checks run server-side.
    var sessionToken = null;
    function cfSaveSession(token, expiresAt) {
      sessionToken = token;
      try { localStorage.setItem('cf-session', JSON.stringify({ t: token, e: expiresAt })); } catch (e) {}
    }
    function cfLoadSession() {
      try {
        var raw = localStorage.getItem('cf-session');
        if (!raw) return null;
        var o = JSON.parse(raw);
        if (!o || !o.t) return null;
        if (o.e && o.e <= Date.now()) { try { localStorage.removeItem('cf-session'); } catch (e2) {} return null; }
        return o;
      } catch (e) { return null; }
    }
    function cfClearSession() {
      sessionToken = null;
      try { localStorage.removeItem('cf-session'); } catch (e) {}
    }
    function cfIsAuthError(err) {
      var m = String((err && err.message) || err || '');
      return /Session expired|Unauthorized|log in again/i.test(m);
    }
    function cfIsMissingKeyError(err) {
      var m = String((err && err.message) || err || '');
      return /API key is not set|Gemini API key|API key.*missing/i.test(m);
    }
    function cfCleanError(err) {
      var m = String((err && err.message) || err || 'Unknown error');
      return m.replace(/^Exception:\s*/i, '');
    }
    function cfIsSpreadsheetError(err) {
      var m = String((err && err.message) || err || '');
      return /Spreadsheet is not configured|Could not open the Google Sheet|SPREADSHEET_ID/i.test(m);
    }
    function cfNoteAuthExpired() {
      cfClearSession();
      try { window.dispatchEvent(new CustomEvent('cf:auth-expired')); } catch (e) {}
    }

    try {
      var now = new Date();
      var fmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      document.getElementById('today-badge').textContent = fmt.format(now);
      document.getElementById('foot-date').textContent = fmt.format(now) + ' · ' + now.getFullYear();
    } catch (e) {}

    function updateCounter() {
      var n = noteEl.value.length;
      counterEl.textContent = n + ' / 1000';
    }
    noteEl.addEventListener('input', updateCounter);
    updateCounter();

    document.querySelectorAll('.chip').forEach(function (chip) {
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        var t = chip.getAttribute('data-text') || '';
        if (activeChip === chip) {
          // Toggle off: restore text that was there before the template
          noteEl.value = savedNote;
          chip.classList.remove('active');
          chip.setAttribute('aria-pressed', 'false');
          activeChip = null;
          savedNote = '';
        } else {
          // First activation stashes current text; switching templates keeps the original stash
          if (!activeChip) savedNote = noteEl.value;
          if (activeChip && activeChip !== chip) {
            activeChip.classList.remove('active');
            activeChip.setAttribute('aria-pressed', 'false');
          }
          noteEl.value = t;
          chip.classList.add('active');
          chip.setAttribute('aria-pressed', 'true');
          activeChip = chip;
        }
        if (noteEl.value.length > 1000) noteEl.value = noteEl.value.slice(0, 1000);
        updateCounter();
        noteEl.focus();
      });
    });

    function clearChipState() {
      if (activeChip) {
        activeChip.classList.remove('active');
        activeChip.setAttribute('aria-pressed', 'false');
      }
      activeChip = null;
      savedNote = '';
    }

    function openPicker(input) { input.click(); }
    cameraBtn.addEventListener('click', function (e) { e.stopPropagation(); openPicker(cameraInput); });
    galleryBtn.addEventListener('click', function (e) { e.stopPropagation(); openPicker(galleryInput); });
    addMoreBtn.addEventListener('click', function (e) { e.stopPropagation(); openPicker(galleryInput); });
    removeAllBtn.addEventListener('click', function (e) { e.stopPropagation(); clearPreview(); });
    uploadZone.addEventListener('click', function (e) {
      if (e.target.closest('.thumb-remove') || e.target.closest('.btn-choice') || e.target.closest('.add-more')) return;
      if (selectedFiles.length > 0) return;
      openPicker(galleryInput);
    });
    uploadZone.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(galleryInput); }
    });

    // Drag & drop (desktop) - accepts multiple files
    ['dragenter', 'dragover'].forEach(function (ev) {
      uploadZone.addEventListener(ev, function (e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      uploadZone.addEventListener(ev, function (e) { e.preventDefault(); uploadZone.classList.remove('dragover'); });
    });
    uploadZone.addEventListener('drop', function (e) {
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || files.length === 0) return;
      addFiles(files);
    });

    cameraInput.addEventListener('change', function () {
      if (cameraInput.files.length > 0) addFiles(cameraInput.files);
      cameraInput.value = '';
    });

    galleryInput.addEventListener('change', function () {
      if (galleryInput.files.length > 0) addFiles(galleryInput.files);
      galleryInput.value = '';
    });

    function addFiles(fileList) {
      var added = 0;
      for (var i = 0; i < fileList.length; i++) {
        var f = fileList[i];
        if (!f.type || f.type.indexOf('image/') !== 0) continue;
        selectedFiles.push(f);
        added++;
      }
      if (added > 0) renderPreviews();
    }

    function renderPreviews() {
      previewGrid.innerHTML = '';
      if (selectedFiles.length === 0) {
        previewWrap.classList.add('hidden');
        uploadPlaceholder.classList.remove('hidden');
        previewCount.textContent = '0 photos';
        photoCountLabel.textContent = 'JPG · PNG · WEBP · HEIC';
        return;
      }
      var frag = document.createDocumentFragment();
      selectedFiles.forEach(function (file, idx) {
        var url = previewUrlFor(file);
        var thumb = document.createElement('button');
        thumb.type = 'button';
        thumb.className = 'preview-thumb';
        thumb.setAttribute('aria-label', 'View photo ' + (idx + 1));
        var img = document.createElement('img');
        img.src = url;
        img.alt = 'Receipt ' + (idx + 1);
        img.loading = 'lazy';
        img.decoding = 'async';
        var num = document.createElement('span');
        num.className = 'thumb-num';
        num.textContent = idx + 1;
        var expand = document.createElement('span');
        expand.className = 'thumb-expand';
        expand.setAttribute('aria-hidden', 'true');
        expand.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>';
        var rm = document.createElement('span');
        rm.className = 'thumb-remove';
        rm.setAttribute('role', 'button');
        rm.setAttribute('aria-label', 'Remove photo ' + (idx + 1));
        rm.setAttribute('tabindex', '0');
        rm.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>';
        rm.addEventListener('click', function (e) {
          e.stopPropagation();
          releasePreviewUrl(selectedFiles[idx]);
          selectedFiles.splice(idx, 1);
          renderPreviews();
        });
        rm.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); releasePreviewUrl(selectedFiles[idx]); selectedFiles.splice(idx, 1); renderPreviews(); }
        });
        thumb.appendChild(img);
        thumb.appendChild(num);
        thumb.appendChild(expand);
        thumb.appendChild(rm);
        thumb.addEventListener('click', function () { openLightbox(idx); });
        frag.appendChild(thumb);
      });
      var addTile = document.createElement('button');
      addTile.type = 'button';
      addTile.className = 'add-tile';
      addTile.setAttribute('aria-label', 'Add more photos');
      addTile.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>';
      addTile.addEventListener('click', function (e) { e.stopPropagation(); openPicker(galleryInput); });
      frag.appendChild(addTile);
      previewGrid.appendChild(frag);
      var label = selectedFiles.length + (selectedFiles.length === 1 ? ' photo' : ' photos');
      previewCount.textContent = label;
      photoCountLabel.textContent = label;
      previewWrap.classList.remove('hidden');
      uploadPlaceholder.classList.add('hidden');
    }

    function clearPreview() {
      cameraInput.value = '';
      galleryInput.value = '';
      selectedFiles = [];
      releaseAllPreviewUrls();
      closeLightbox();
      renderPreviews();
    }

    /* Fullscreen viewer */
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    var lightboxCounter = document.getElementById('lightbox-counter');
    var lightboxPrev = document.getElementById('lightbox-prev');
    var lightboxNext = document.getElementById('lightbox-next');
    var lightboxDelete = document.getElementById('lightbox-delete');
    var lbIndex = 0;
    var touchStartX = null;

    function openLightbox(i) {
      if (!selectedFiles.length) return;
      lbIndex = Math.max(0, Math.min(i, selectedFiles.length - 1));
      showLbPhoto();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('lightbox-close').focus();
    }
    function showLbPhoto() {
      lightboxImg.src = previewUrlFor(selectedFiles[lbIndex]);
      lightboxImg.alt = 'Receipt ' + (lbIndex + 1) + ' full view';
      lightboxCounter.textContent = (lbIndex + 1) + ' / ' + selectedFiles.length;
      lightboxPrev.disabled = lbIndex === 0;
      lightboxNext.disabled = lbIndex === selectedFiles.length - 1;
      lightboxDelete.textContent = 'Remove photo ' + (lbIndex + 1);
    }
    function closeLightbox() {
      if (!lightbox.classList.contains('open')) return;
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightboxImg.src = '';
    }
    function stepLightbox(d) {
      var n = lbIndex + d;
      if (n < 0 || n >= selectedFiles.length) return;
      lbIndex = n;
      showLbPhoto();
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', function () { stepLightbox(-1); });
    lightboxNext.addEventListener('click', function () { stepLightbox(1); });
    lightboxDelete.addEventListener('click', function () {
      releasePreviewUrl(selectedFiles[lbIndex]);
      selectedFiles.splice(lbIndex, 1);
      if (!selectedFiles.length) { closeLightbox(); renderPreviews(); return; }
      if (lbIndex >= selectedFiles.length) lbIndex = selectedFiles.length - 1;
      showLbPhoto();
      renderPreviews();
    });
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') stepLightbox(-1);
      else if (e.key === 'ArrowRight') stepLightbox(1);
    });
    lightboxImg.addEventListener('touchstart', function (e) {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    lightboxImg.addEventListener('touchend', function (e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) > 48) stepLightbox(dx < 0 ? 1 : -1);
    }, { passive: true });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var noteText = noteEl.value.trim();

      if (selectedFiles.length === 0 && !noteText) {
        setStatus('Add a photo or a description first.', 'error');
        return;
      }

      if (!navigator.onLine && typeof window.cfQueueOffline === 'function') {
        window.cfQueueOffline();
        setStatus('Saved offline. Open the app when online to send it.', 'success');
        return;
      }

      submitBtn.disabled = true;
      submitLabel.textContent = 'Saving…';
      if (selectedFiles.length > 1) {
        setStatus('Reading ' + selectedFiles.length + ' receipts in one pass…', '');
      } else {
        setStatus('Processing…', '');
      }

      if (selectedFiles.length > 0) {
        var files = selectedFiles.slice();
        var images = new Array(files.length);
        var pending = files.length;
        var failed = false;
        files.forEach(function (file, idx) {
          var reader = new FileReader();
          reader.onload = function () {
            if (failed) return;
            images[idx] = { data: reader.result.split(',')[1], mimeType: file.type };
            pending--;
            if (pending === 0) submitExpenses(images, noteText);
          };
          reader.onerror = function () {
            if (failed) return;
            failed = true;
            submitBtn.disabled = false;
            submitLabel.textContent = 'Log entry';
            setStatus('Could not read photo ' + (idx + 1) + '. Try again.', 'error');
          };
          reader.readAsDataURL(file);
        });
      } else {
        submitExpenses([], noteText);
      }
    });

    function cfRowMeta_(r) {
      r = r || {};
      return {
        currency: r.currency, fxRate: r.fxRate, tags: r.tags, member: r.member,
        reimbursable: r.reimbursable, reimbursed: r.reimbursed, receiptHash: r.receiptHash,
        receiptUrl: r.receiptUrl, splitGroup: r.splitGroup, baseAmount: r.baseAmount,
        splits: r.splits || null
      };
    }
    function cfReviewGate_(pre, rows) {
      try {
        if (typeof window.cfReviewBeforeSaveEnabled !== 'function' ||
            !window.cfReviewBeforeSaveEnabled() ||
            typeof window.cfReviewBeforeCommit !== 'function') return Promise.resolve(true);
        var byId = {};
        (rows || []).forEach(function (r) { byId[r.row_id] = r; });
        var madeUrls = [];
        var items = (pre.items || []).map(function (it) {
          var r = byId[it.row_id] || {};
          var photoUrl = (r.el && r.el._previewUrl) || r.previewUrl || '';
          if (!photoUrl && r.data) photoUrl = 'data:' + (r.mimeType || 'image/jpeg') + ';base64,' + r.data;
          if (!photoUrl && r.file && window.URL) {
            try { photoUrl = URL.createObjectURL(r.file); madeUrls.push(photoUrl); } catch (e) {}
          }
          var copy = {};
          for (var k in it) if (Object.prototype.hasOwnProperty.call(it, k)) copy[k] = it[k];
          copy.photoUrl = photoUrl;
          return copy;
        });
        return Promise.resolve(window.cfReviewBeforeCommit(items, pre.verdicts || []))
          .then(function (res) {
            madeUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
            if (res === false) return false;
            var edits = (res && res.edits) || {};
            (pre.items || []).forEach(function (it) {
              var e = edits[it.row_id];
              if (!e || !it.txn) return;
              if (e.merchant !== undefined) it.txn.merchant = e.merchant;
              if (e.date) it.txn.transaction_date = e.date;
              if (e.type === 'Income' || e.type === 'Expense') it.txn.transaction_type = e.type;
              if (e.category && it.txn.items && it.txn.items.length) {
                it.txn.items[0].category = e.category;
                if (e.type === 'Income') it.txn.items[0].spending_type = '';
              }
            });
            return true;
          })
          .catch(function () { madeUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} }); return true; });
      } catch (e) { return Promise.resolve(true); }
    }
    function cfEntryMetaSafe() {
      try { return (typeof window.cfEntryMetaValues === 'function' ? window.cfEntryMetaValues() : {}) || {}; }
      catch (e) { return {}; }
    }
    function cfHex_(buf) {
      var bytes = new Uint8Array(buf);
      var out = '';
      for (var i = 0; i < bytes.length; i++) out += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
      return out;
    }
    var cfFileHashCache = new Map();
    function cfFileHash(file) {
      if (!file || !window.crypto || !crypto.subtle) return Promise.resolve('');
      if (cfFileHashCache.has(file)) return cfFileHashCache.get(file);
      var p = file.arrayBuffer().then(function (buf) {
        return crypto.subtle.digest('SHA-256', buf);
      }).then(cfHex_)['catch'](function () { return ''; });
      cfFileHashCache.set(file, p);
      return p;
    }
    function cfDataHash(data) {
      if (!window.crypto || !crypto.subtle || !data) return Promise.resolve('');
      try {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(data)))
          .then(cfHex_)['catch'](function () { return ''; });
      } catch (e) { return Promise.resolve(''); }
    }

    // Fast, synchronous fallback fingerprint; the engine replaces it with a
    // SHA-256 image hash whenever WebCrypto is available.
    function cfReceiptHash(file, note, data) {
      if (!file) return '';
      var seed = (file ? [file.name || '', file.size || 0, file.lastModified || 0].join('|') : '') +
        '|' + String(note || '') + '|' + String(data || '').length;
      var h = 2166136261;
      for (var i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i);
        h = (h * 16777619) >>> 0;
      }
      return 'r' + h.toString(16);
    }

    function submitExpenses(images, noteText) {
      var oneRowBox = document.getElementById('toggle-onerow');
      var oneRow = !!(oneRowBox && oneRowBox.checked);
      var meta = cfEntryMetaSafe();
      var rows = (images && images.length ? images : [null]).map(function (img, i) {
        var f = selectedFiles[i] || null;
        return {
          row_id: cfUuid(), origNum: i + 1, note: noteText, type: null,
          file: null, data: (img && img.data) || '', mimeType: (img && img.mimeType) || 'image/jpeg',
          hasPhoto: !!(img && img.data),
          currency: meta.currency, fxRate: meta.fxRate, tags: meta.tags, member: meta.member,
          reimbursable: meta.reimbursable ? 'Yes' : 'No',
          receiptHash: cfReceiptHash(f, noteText, (img && img.data) || '')
        };
      });
      if (window.google && google.script && google.script.run) {
        setStatus('Processing…', '');
        cfEngineSubmit({
          rows: rows,
          sessionToken: sessionToken,
          // Quick-Input (this panel) always force-saves; see cfEngineSubmit.
          quickForce: true,
          forceDuplicate: !!meta.allowDuplicate,
          oneRowPerReceipt: oneRow,
          progress: function (t) { setStatus(t, ''); }
        }).then(function (report) {
          var counts = (report && report.summary) || {};
          var doneN = (counts.logged || 0) + (counts.duplicates || 0);
          var committedById = {};
          (report.rows || []).forEach(function (r) {
            if (r.status === 'logged' || r.status === 'force-adjusted' || r.duplicate) {
              committedById[r.row_id] = true;
            }
          });
          // Remove only the photos the server confirmed (logged or safely
          // recognized duplicate). Photos for review/error rows stay, with
          // their note text, so nothing unconfirmed is ever lost. rows[i]
          // aligns with images[i] and selectedFiles[i] for photo submissions.
          var keptIdx = [];
          rows.forEach(function (r, i) {
            if (!committedById[r.row_id] && i < selectedFiles.length) keptIdx.push(i);
          });
          if (keptIdx.length < selectedFiles.length) {
            var keepSet = {};
            keptIdx.forEach(function (i) { keepSet[i] = true; });
            selectedFiles.forEach(function (f, i) { if (!keepSet[i]) releasePreviewUrl(f); });
            var remaining = keptIdx.map(function (i) { return selectedFiles[i]; });
            selectedFiles.length = 0;
            remaining.forEach(function (f) { selectedFiles.push(f); });
            renderPreviews();
          }
          var parts = [];
          // Server disclosures ride along even for rows that saved cleanly, so
          // an incomplete line list saved under a verified total is never
          // silent. The same text is already stored in that receipt's Notes.
          (report.rows || []).forEach(function (r) {
            if (r.disclosure) parts.push('Receipt ' + (r.transactionId || r.origNum || '?') + ': ' + r.disclosure);
          });
          (report.rows || []).forEach(function (r) {
            if (r.status === 'logged' || r.duplicate) return;
            if (r.status === 'force-adjusted') {
              parts.push('Adjusted row (' + (r.transactionId || '?') + '): ' + (r.message || ''));
            } else {
              parts.push(r.message || 'Row needs review.');
            }
          });
          var okN = (counts.logged || 0) + (counts.forceAdjusted || 0);
          if (okN > 0) {
            var msg = 'Logged ' + okN + ' receipt' + (okN === 1 ? '' : 's');
            if (counts.forceAdjusted) msg += ' (includes a clearly marked balancing line - please verify)';
            msg += '.';
            if (parts.length) msg += ' ' + parts.join(' ');
            var hasUnresolved = (report.rows || []).some(function (r) {
              return r.status === 'review' || r.status === 'error';
            });
            onSuccess(msg, hasUnresolved);
          } else {
            onFailure({ message: parts.join(' ') || 'Nothing was logged.' });
            return;
          }
          if (report.sortEligible) {
            cfCall('sortCashflowSheets', [sessionToken]).then(function () {}, function () {});
          }
        }).catch(onFailure);
      } else {
        // Local preview (outside Apps Script): simulate success so layout can be reviewed
        var n = images ? images.length : 0;
        setTimeout(function () { onSuccess(n > 1 ? 'Logged ' + n + ' receipts (preview)' : 'Income logged: Demo Client, 1 item(s), total Rp1.500.000 (preview)'); }, 900);
      }
    }

    function onSuccess(summary, keepForm) {
      submitBtn.disabled = false;
      submitLabel.textContent = 'Log entry';
      if (!keepForm) {
        try { if (window.cfClearDraft) window.cfClearDraft(); } catch (e0) {}
      }
      var isIncome = /^income/i.test(summary || '');
      setStatus(summary, isIncome ? 'success income' : 'success');
      // When receipts remain for review, their photos were kept above: keep
      // the note too so the user can resubmit or adjust. Otherwise reset.
      if (!keepForm) {
        form.reset();
        clearPreview();
      }
      clearChipState();
      updateCounter();
      try { maybeTrashCleanup(sessionToken); } catch (e) {}
      try { window.dispatchEvent(new CustomEvent('cf:history-changed')); } catch (e2) {}
    }

    function onFailure(err) {
      submitBtn.disabled = false;
      submitLabel.textContent = 'Log entry';

                return {};
              }).catch(function (err) {
                if (cfAuthError(err)) throw err;
                if (cfSizeError(err) && canSplit) return { split: true };
                progress(label + ': a group failed; keeping originals for review.');
                return {};
              });
            });
          }, progress);
        }
        function retriageRepaired() {
          var re = Object.keys(st.repairedTxnById).map(function (id) {
            var orig = byId[id] || {};
            return { row_id: id, origNum: orig.origNum || 0, forcedType: orig.forcedType || null, note: orig.note || '',
                     hasPhoto: !!orig.hasPhoto, phase1: orig.phase1 || null,
                     txn: st.repairedTxnById[id], repaired: true };
          }).filter(function (it) { return !!it.txn; });
          if (!re.length) return Promise.resolve([]);
          return cfCall('reconcileReceiptRows', [{ submission_id: submissionId, forceLog: tg.forceLog, quickMode: quickMode }, re, token])
            .then(function (res) { return res.rows || []; })
            .catch(function (err) {
              if (cfAuthError(err)) throw err;
              progress('Repair re-check skipped; keeping latest results for review.');
              return [];
            });
        }
        function done() { return { items: tri.items, repairedTxnById: st.repairedTxnById, verdicts: tri.verdicts }; }
        var eligible = tri.verdicts.filter(function (v) { return v.repairEligible; });
        if (!eligible.length) return done();
        var extraLeft = opts.quickForce ? QUICK_EXTRA_REPAIRS : 0;
        function extraRound() {
          if (extraLeft <= 0) return Promise.resolve();
          return retriageRepaired().then(function (verdicts) {
            var still = verdicts.filter(function (v) { return v.status === 'mismatch'; });
            if (!still.length) return;
            extraLeft--;
            progress('Quick-Input retry (' + (QUICK_EXTRA_REPAIRS - extraLeft) + ' of ' + QUICK_EXTRA_REPAIRS + ')…');
            return runRepairBatch(still, 'Quick-Input retry').then(extraRound);
          });
        }
        progress('Repair pass: re-checking ' + eligible.length + ' mismatched row(s)…');
        return runRepairBatch(eligible, 'Repair pass').then(extraRound).then(done);
      }).then(function (pre) {
        // 6. optional human review before the commit, then commit.
        var finals = pre.items.map(function (it) {
          var fixed = (it.row_id in pre.repairedTxnById) ? pre.repairedTxnById[it.row_id] : it.txn;
          return { row_id: it.row_id, origNum: it.origNum, forcedType: it.forcedType, note: it.note,
                   hasPhoto: it.hasPhoto, phase1: it.phase1, txn: fixed, repaired: (it.row_id in pre.repairedTxnById) || !!it.repaired,
                   preError: it.preError || '', currency: it.currency, fxRate: it.fxRate, tags: it.tags,
                   member: it.member, reimbursable: it.reimbursable, receiptHash: it.receiptHash,
                   receiptUrl: it.receiptUrl, baseAmount: it.baseAmount, splitGroup: it.splitGroup,
                   splits: it.splits || null };
        });
        return cfReviewGate_(pre, rows).then(function (ok) {
          if (!ok) throw new Error('Save cancelled - rows kept in the form.');
          progress('Writing validated rows…');
          return cfCall('commitReceiptRows', [{ submission_id: submissionId, forceLog: tg.forceLog,
            oneRowPerReceipt: oneRowFlag, quickMode: quickMode,
            forceDuplicate: !!opts.forceDuplicate }, finals, token]);
        });
      });
      return chain;
    }
